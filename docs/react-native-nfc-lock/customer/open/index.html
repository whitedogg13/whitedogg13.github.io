<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="One2Lock Customer App 的開啟與安裝說明。">
    <title>One2Lock Customer</title>
    <link rel="stylesheet" href="/assets/site.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">ONE2LOCK</p>
      <h1>One2Lock Customer</h1>
      <p>使用手機與認證卡，操作你的 One2Lock NFC 鎖。</p>
      <ol>
        <li><strong>已安裝 App？</strong><br>請從手機主畫面開啟 Customer App，也可以從訊息或郵件再次點擊這個連結。</li>
        <li><strong>還沒安裝？</strong><br>請向管理員索取 iOS 或 Android 的安裝方式，安裝完成後開啟 App。</li>
        <li><strong>準備使用。</strong><br>依 App 指示匯入認證卡，再由你操作並掃描實體鎖。</li>
      </ol>
      <p class="note">如果連結留在瀏覽器，請手動開啟 App。開啟連結本身不會操作鎖。</p>
      <a href="/">返回首頁</a>
    </main>
